<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CYCLIA · Datos del ciclo y salud</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3A44C4}a:hover{color:#262C8F}
.cy-bg{background-image:url(/_blob/453dea8e03cf7de0e2cf695f0d004675);background-size:390px 844px;background-repeat:no-repeat}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;text-decoration:none;color:#5B6190;font:700 11px 'Nunito Sans',sans-serif}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#3A44C4}
input{font:600 15px 'Nunito Sans',sans-serif;color:#1B1F5E}
</style>
</helmet>
<div class="cy-bg" style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #E3F1FB; font-family: 'Nunito Sans', sans-serif; color: #1B1F5E">
<main style="position: absolute; left: 0; right: 0; top: 0; bottom: 82px; overflow-y: auto">
<header style="padding: 44px 18px 10px; display: flex; flex-direction: column; gap: 6px">
<a href="Perfil.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 44px; text-decoration: none; font-weight: 800; font-size: 15px"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg>Perfil</a>
<h1 style="margin: 0; font-size: 26px; font-weight: 800">Datos del ciclo y salud</h1>
<p style="margin: 0; font-size: 14px; color: #4A4F7A">Con esto Cyclia calcula tu fase y personaliza sus recomendaciones.</p>
</header>
<form style="padding: 8px 14px 24px; display: flex; flex-direction: column; gap: 12px">
<section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Nombre<input type="text" value="Valentina" style="height: 46px; border: 1.5px solid #C9D3EF; border-radius: 12px; padding: 0 12px; background: #F8F9FE"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Inicio del último periodo<input type="date" value="2026-10-07" style="height: 46px; border: 1.5px solid #C9D3EF; border-radius: 12px; padding: 0 12px; background: #F8F9FE"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Duración del ciclo<input type="number" value="28" min="20" max="45" style="height: 46px; border: 1.5px solid #C9D3EF; border-radius: 12px; padding: 0 12px; background: #F8F9FE"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Duración del periodo<input type="number" value="5" min="2" max="10" style="height: 46px; border: 1.5px solid #C9D3EF; border-radius: 12px; padding: 0 12px; background: #F8F9FE"></label>
</div>
</section>
<section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 800">Condiciones de salud <span style="font-weight: 600; color: #4A4F7A">· opcional</span></h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{conds}}" as="c" hint-placeholder-count="7">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: #1B1F5E; font: 700 13px 'Nunito Sans', sans-serif; cursor: pointer">{{c.name}}</button>
</sc-for>
</div>
</section>
<a href="Perfil-Objetivos.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 20px; background: #FFFFFF; color: #1B1F5E; text-decoration: none; font-weight: 800; font-size: 15px">Mis objetivos: Productividad, Bienestar diario<svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#3A44C4" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"></path></svg></a>
<a href="Perfil.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 26px; background: #F49A9E; color: #1B1F5E; text-decoration: none; font-weight: 800; font-size: 16px">Guardar cambios</a>
</form>
</main>
<nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; box-sizing: border-box; padding: 10px 6px 0; background: #FFFFFF; border-top: 1px solid #E1E5F5; display: flex">
<a class="tab" href="Inicio.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
<a class="tab" href="Ciclo.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Ciclo</a>
<a class="tab" href="Registro.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Registro</a>
<a class="tab" href="Chat.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></svg>Cyclia IA</a>
<a class="tab on" href="Perfil.dc.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { c: {}, g: 0 }; }
renderVals() {
const names = ['Celiaquía','Diabetes','SOP','Endometriosis','Hipotiroidismo','Depresión o ansiedad','Prefiero no decir'];
const c = this.state.c;
const G = ['Productividad y foco','Energía y actividad física','Bienestar emocional'];
return {
  conds: names.map(n=>({ name:n, on: c[n]?'true':'false', bg: c[n]?'#F49A9E':'#FFF6CF', border: c[n]?'#E57F86':'#F6E27F', pick:()=>this.setState({ c:{ ...c, [n]:!c[n] } }) })),
  goals: G.map((n,i)=>{ const on = i===this.state.g; return { name:n, on: on?'true':'false', bg: on?'#3A44C4':'#FFFFFF', fg: on?'#FFFFFF':'#1B1F5E', border: on?'#3A44C4':'#C9D3EF', pick:()=>this.setState({ g:i }) }; })
};
}
}
</script>
</body>
</html>
