<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CYCLIA · Tu fase en detalle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3A44C4}a:hover{color:#262C8F}
.cy-bg{background-image:url(/_blob/453dea8e03cf7de0e2cf695f0d004675);background-size:390px 844px;background-repeat:no-repeat}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;text-decoration:none;color:#5B6190;font:700 11px 'Nunito Sans',sans-serif}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#3A44C4}
</style>
</helmet>
<div class="cy-bg" style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #E3F1FB; font-family: 'Nunito Sans', sans-serif; color: #1B1F5E">
<main style="position: absolute; left: 0; right: 0; top: 0; bottom: 82px; overflow-y: auto">
<header style="padding: 44px 18px 22px; background: {{cur.bg}}; color: {{cur.fg}}; display: flex; flex-direction: column; gap: 10px">
<a href="Inicio.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 44px; color: {{cur.fg}}; text-decoration: none; font-weight: 800; font-size: 15px"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg>Inicio</a>
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em">{{cur.days}}</span>
<h1 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 400; font-size: 36px">Fase {{cur.name}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45">{{cur.lead}}</p>
</header>
<div role="tablist" aria-label="Fases del ciclo" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 14px 18px 4px">
<sc-for list="{{phases}}" as="p" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{p.sel}}" onClick="{{p.pick}}" style="min-height: 44px; border-radius: 22px; border: 1.5px solid {{p.border}}; background: {{p.btnBg}}; color: {{p.btnFg}}; font: 800 12px 'Nunito Sans', sans-serif; cursor: pointer">{{p.name}}</button>
</sc-for>
</div>
<div style="padding: 12px 18px 24px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{cur.blocks}}" as="b" hint-placeholder-count="5">
<section style="background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{b.dot}}"></span>{{b.t}}</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #3B4070">{{b.d}}</p>
</section>
</sc-for>
<p style="margin: 4px 0 0; font-size: 12px; color: #4A4F7A">Información educativa y de bienestar. Ante síntomas persistentes, consulta a un profesional de salud.</p>
</div>
</main>
<nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; box-sizing: border-box; padding: 10px 6px 0; background: #FFFFFF; border-top: 1px solid #E1E5F5; display: flex">
<a class="tab on" href="Inicio.dc.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
<a class="tab" href="Ciclo.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Ciclo</a>
<a class="tab" href="Registro.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Registro</a>
<a class="tab" href="Chat.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></svg>Cyclia IA</a>
<a class="tab" href="Perfil.dc.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { sel: 1 }; }
renderVals() {
const P = [
{ name:'Menstrual', bg:'#F49A9E', fg:'#1B1F5E', days:'DÍAS 1 A 5', lead:'Tus hormonas están en su punto más bajo. Es una fase para bajar el ritmo y escucharte.',
  blocks:[['Qué pasa en tu cuerpo','El estrógeno y la progesterona están bajos y el útero renueva su revestimiento.'],['Energía y ánimo','Puedes sentir más cansancio y necesidad de recogimiento. Es normal.'],['Productividad','Ideal para revisar, evaluar lo hecho y cerrar pendientes sin presión.'],['Bienestar','Movimiento suave, calor local y buen descanso pueden ayudarte.'],['Alimentación','Alimentos con hierro como legumbres y hojas verdes, y buena hidratación.']] },
{ name:'Folicular', bg:'#A9C4F0', fg:'#1B1F5E', days:'DÍAS 6 A 13 · HOY ESTÁS AQUÍ', lead:'El estrógeno empieza a subir y con él tu energía, tu ánimo y tu curiosidad.',
  blocks:[['Qué pasa en tu cuerpo','Los folículos maduran y el estrógeno aumenta día a día.'],['Energía y ánimo','Más motivación y disposición para lo nuevo.'],['Productividad','Buen momento para planificar, aprender y empezar proyectos.'],['Bienestar','Tu cuerpo suele tolerar mejor el ejercicio más intenso.'],['Alimentación','Proteínas, verduras frescas y fibra para acompañar tu energía.']] },
{ name:'Ovulatoria', bg:'#F6E27F', fg:'#1B1F5E', days:'DÍAS 14 A 16', lead:'Tu energía social y comunicativa suele estar en su punto más alto.',
  blocks:[['Qué pasa en tu cuerpo','El estrógeno alcanza su pico y se libera el óvulo.'],['Energía y ánimo','Mayor seguridad y ganas de conectar con otras personas.'],['Productividad','Agenda aquí reuniones, presentaciones y conversaciones importantes.'],['Bienestar','Aprovecha para actividades en grupo y ejercicio de mayor exigencia.'],['Alimentación','Frutas y verduras de colores, e hidratación constante.']] },
{ name:'Lútea', bg:'#3A44C4', fg:'#FFFFFF', days:'DÍAS 17 A 28', lead:'La progesterona toma el protagonismo y el cuerpo pide más orden y calma.',
  blocks:[['Qué pasa en tu cuerpo','Predomina la progesterona; hacia el final ambas hormonas bajan.'],['Energía y ánimo','La energía desciende poco a poco y pueden aparecer molestias premenstruales.'],['Productividad','Tareas de detalle, terminar lo empezado y ordenar.'],['Bienestar','Ejercicio moderado, rutinas de sueño y momentos de pausa.'],['Alimentación','Carbohidratos complejos y alimentos con magnesio; modera cafeína y sal.']] }
];
const dots = ['#F49A9E','#A9C4F0','#F6E27F','#3A44C4','#1B1F5E'];
const s = this.state.sel;
const c = P[s];
return {
  cur: { ...c, blocks: c.blocks.map((b,i)=>({ t:b[0], d:b[1], dot:dots[i] })) },
  phases: P.map((p,i)=>({ name:p.name, sel: i===s ? 'true':'false', btnBg: i===s ? '#F49A9E' : '#FFF6CF', btnFg: '#1B1F5E', border: i===s ? '#E57F86' : '#F6E27F', pick: ()=>this.setState({ sel:i }) }))
};
}
}
</script>
</body>
</html>
