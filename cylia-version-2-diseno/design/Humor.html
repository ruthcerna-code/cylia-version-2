<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CYCLIA · ¿Cómo te sientes?</title>
<script src="cyclia-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3A44C4}a:hover{color:#262C8F}
.cy-bg{background-image:url(flores-fondo.svg);background-size:390px 844px;background-repeat:no-repeat}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;text-decoration:none;color:#5B6190;font:700 11px 'Nunito Sans',sans-serif}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#3A44C4}
</style>
</helmet>
<div class="cy-bg" style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #E3F1FB; font-family: 'Nunito Sans', sans-serif; color: #1B1F5E">
<main style="position: absolute; left: 0; right: 0; top: 0; bottom: 82px; overflow-y: auto">
<header style="padding: 44px 18px 10px; display: flex; flex-direction: column; gap: 6px">
<a href="Inicio.html" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 44px; text-decoration: none; font-weight: 800; font-size: 15px"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg>Inicio</a>
<h1 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 400; font-size: 34px; color: #3A44C4">¿Cómo te sientes?</h1>
<p style="margin: 0; font-size: 14px; color: #4A4F7A">Tu elección actualiza el registro de hoy.</p>
</header>
<div style="padding: 8px 14px 24px; display: flex; flex-direction: column; gap: 12px">
<section style="background: #FFFFFF; border-radius: 22px; padding: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
<button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="min-height: 96px; border-radius: 18px; border: 2px solid {{m.border}}; background: {{m.bg}}; color: #1B1F5E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font: 800 14px 'Nunito Sans', sans-serif; cursor: pointer">
<svg aria-hidden="true" viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="17" fill="{{m.face}}"></circle><circle cx="14" cy="16" r="2.2" fill="#1B1F5E"></circle><circle cx="26" cy="16" r="2.2" fill="#1B1F5E"></circle><path d="{{m.mouth}}" fill="none" stroke="#1B1F5E" stroke-width="2.4" stroke-linecap="round"></path></svg>
{{m.name}}
</button>
</sc-for>
</section>
<section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 800">¿Qué está influyendo hoy?</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; color: #1B1F5E; font: 700 13px 'Nunito Sans', sans-serif; cursor: pointer">{{t.name}}</button>
</sc-for>
</div>
</section>
<a href="Inicio.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 26px; background: #F49A9E; color: #1B1F5E; text-decoration: none; font-weight: 800; font-size: 16px">Guardar en mi registro</a>
<a href="Registro.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 24px; background: #F6E27F; color: #1B1F5E; font-weight: 800; font-size: 15px; text-decoration: none">Hacer el registro completo</a>
</div>
</main>
<nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; box-sizing: border-box; padding: 10px 6px 0; background: #FFFFFF; border-top: 1px solid #E1E5F5; display: flex">
<a class="tab on" href="Inicio.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
<a class="tab" href="Ciclo.html"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Ciclo</a>
<a class="tab" href="Registro.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Registro</a>
<a class="tab" href="Chat.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></svg>Cyclia IA</a>
<a class="tab" href="Perfil.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { m: 1, t: { 'Trabajo':true } }; }
renderVals() {
const M = [['Muy feliz','#F6E27F','M12 23Q20 32 28 23'],['Bien','#F6E27F','M13 24Q20 29 27 24'],['Neutral','#A9C4F0','M13 26H27'],['Triste','#A9C4F0','M13 28Q20 23 27 28'],['Muy triste','#F49A9E','M12 29Q20 21 28 29']];
const T = ['Sueño','Trabajo','Relaciones','Alimentación','Ejercicio','Mi ciclo'];
const t = this.state.t;
return {
  moods: M.map((m,i)=>{ const on = i===this.state.m; return { name:m[0], face:m[1], mouth:m[2], on: on?'true':'false', bg: on?'#F49A9E':'#FFF6CF', border: on?'#E57F86':'#F6E27F', pick:()=>this.setState({ m:i }) }; }),
  tags: T.map(n=>({ name:n, on: t[n]?'true':'false', bg: t[n]?'#F49A9E':'#FFF6CF', border: t[n]?'#E57F86':'#F6E27F', pick:()=>this.setState({ t:{ ...t, [n]:!t[n] } }) }))
};
}
}
</script>
</body>
</html>
