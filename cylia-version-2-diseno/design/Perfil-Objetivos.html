<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CYCLIA · Objetivos</title>
<script src="cyclia-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3A44C4}a:hover{color:#262C8F}
.cy-bg{background-image:url(flores-fondo.svg);background-size:390px 844px;background-repeat:no-repeat}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;text-decoration:none;color:#5B6190;font:700 11px 'Nunito Sans',sans-serif}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#3A44C4}
</style>
</helmet>
<div class="cy-bg" style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #E3F1FB; font-family: 'Nunito Sans', sans-serif; color: #1B1F5E">
<main style="position: absolute; left: 0; right: 0; top: 0; bottom: 82px; overflow-y: auto">
<header style="padding: 44px 18px 10px; display: flex; flex-direction: column; gap: 6px">
<a href="Perfil.html" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; min-height: 44px; text-decoration: none; font-weight: 800; font-size: 15px"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg>Perfil</a>
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: #4A4F7A">OBJETIVOS</span>
<h1 style="margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 400; font-size: 34px; color: #3A44C4">Elige tu foco</h1>
<p style="margin: 0; font-size: 14px; color: #4A4F7A">Cyclia ajusta sus consejos a lo que más te importa. Puedes elegir más de uno.</p>
</header>
<div style="padding: 8px 14px 24px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="4">
<button type="button" aria-pressed="{{g.on}}" onClick="{{g.pick}}" style="min-height: 76px; padding: 14px 16px; border-radius: 18px; border: 2px solid {{g.border}}; background: {{g.bg}}; color: #1B1F5E; display: flex; align-items: center; gap: 14px; text-align: left; font-family: 'Nunito Sans', sans-serif; cursor: pointer">
<span style="flex: none; width: 14px; height: 14px; border-radius: 7px; background: {{g.dot}}"></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">{{g.name}}</strong><span style="font-size: 13px; color: #3B4070">{{g.sub}}</span></span>
<span style="flex: none; width: 26px; height: 26px; border-radius: 13px; border: 2px solid {{g.border}}; background: {{g.check}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</button>
</sc-for>
<a href="Perfil.html" style="margin-top: 8px; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 26px; background: #F49A9E; color: #1B1F5E; text-decoration: none; font-weight: 800; font-size: 16px">Guardar</a>
</div>
</main>
<nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; box-sizing: border-box; padding: 10px 6px 0; background: #FFFFFF; border-top: 1px solid #E1E5F5; display: flex">
<a class="tab" href="Inicio.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
<a class="tab" href="Ciclo.html"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Ciclo</a>
<a class="tab" href="Registro.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Registro</a>
<a class="tab" href="Chat.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></svg>Cyclia IA</a>
<a class="tab on" href="Perfil.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { on: [false, true, false, true] }; }
renderVals() {
const G = [['Salud física','Energía, descanso y movimiento','#F49A9E'],['Productividad','Foco según tu fase del ciclo','#3A44C4'],['Autoconocimiento','Humor, síntomas y patrones','#A9C4F0'],['Bienestar diario','Un registro corto y constante','#F6E27F']];
const on = this.state.on;
return { goals: G.map((g,i)=>({ name:g[0], sub:g[1], dot:g[2], on: on[i]?'true':'false', bg: on[i]?'#F49A9E':'#FFF6CF', border: on[i]?'#E57F86':'#F6E27F', check: on[i]?'#1B1F5E':'#FFFFFF', pick:()=>{ const v=on.slice(); v[i]=!v[i]; this.setState({ on:v }); } })) };
}
}
</script>
</body>
</html>
