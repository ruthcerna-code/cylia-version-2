<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CYCLIA · Registro diario</title>
<script src="cyclia-runtime.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&amp;family=Nunito+Sans:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#3A44C4}a:hover{color:#262C8F}
.cy-bg{background-image:url(flores-fondo.svg);background-size:390px 844px;background-repeat:no-repeat}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;text-decoration:none;color:#5B6190;font:700 11px 'Nunito Sans',sans-serif}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:#3A44C4}
textarea{font:400 14px 'Nunito Sans',sans-serif;color:#1B1F5E}
</style>
</helmet>
<div class="cy-bg" style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #E3F1FB; font-family: 'Nunito Sans', sans-serif; color: #1B1F5E">
<main style="position: absolute; left: 0; right: 0; top: 0; bottom: 82px; overflow-y: auto">
<header style="padding: 56px 18px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Josefin Sans', sans-serif; font-size: 15px; letter-spacing: 0.18em; color: #3A44C4">CYCLIA</span>
<h1 style="margin: 0; font-size: 28px; font-weight: 800">¿Cómo estás hoy?</h1>
<p style="margin: 0; font-size: 14px; color: #4A4F7A">Jueves 15 de octubre · Día 9 · Fase folicular</p>
</header>
<form style="padding: 4px 14px 24px; display: flex; flex-direction: column; gap: 12px">
<section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{scales}}" as="s" hint-placeholder-count="5">
<fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; font-size: 14px; font-weight: 800; margin-bottom: 8px">{{s.label}} <span style="font-weight: 600; color: #4A4F7A">· {{s.hint}}</span></legend>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{s.opts}}" as="o" hint-placeholder-count="5">
<button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="height: 44px; border-radius: 12px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font: 800 15px 'Nunito Sans', sans-serif; cursor: pointer">{{o.v}}</button>
</sc-for>
</div>
</fieldset>
</sc-for>
</section>
<section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 14px; font-weight: 800">Síntomas</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{symptoms}}" as="y" hint-placeholder-count="8">
<button type="button" aria-pressed="{{y.on}}" onClick="{{y.pick}}" style="min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid {{y.border}}; background: {{y.bg}}; color: #1B1F5E; font: 700 13px 'Nunito Sans', sans-serif; cursor: pointer">{{y.name}}</button>
</sc-for>
</div>
</section>
<section style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800">¿Cómo dormiste?<textarea rows="2" placeholder="Ej.: 7 horas, me desperté una vez" style="border: 1.5px solid #C9D3EF; border-radius: 12px; padding: 10px; resize: none; background: #F8F9FE"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800">Hábitos de hoy<textarea rows="2" placeholder="Ej.: caminé 30 min, mucho café" style="border: 1.5px solid #C9D3EF; border-radius: 12px; padding: 10px; resize: none; background: #F8F9FE"></textarea></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 800">Notas para Cyclia<textarea rows="2" placeholder="Algo que quieras que Cyclia tenga en cuenta" style="border: 1.5px solid #C9D3EF; border-radius: 12px; padding: 10px; resize: none; background: #F8F9FE"></textarea></label>
</section>
<a href="Registro-Analisis.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 26px; background: #F49A9E; color: #1B1F5E; text-decoration: none; font-weight: 800; font-size: 16px">Guardar y analizar</a>
<a href="Ciclo.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 24px; background: #F6E27F; color: #1B1F5E; text-decoration: none; font-weight: 800; font-size: 15px">Solo guardar</a>
</form>
</main>
<nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; box-sizing: border-box; padding: 10px 6px 0; background: #FFFFFF; border-top: 1px solid #E1E5F5; display: flex">
<a class="tab" href="Inicio.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
<a class="tab" href="Ciclo.html"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Ciclo</a>
<a class="tab on" href="Registro.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>Registro</a>
<a class="tab" href="Chat.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"></path></svg>Cyclia IA</a>
<a class="tab" href="Perfil.html"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(p){ super(p); this.state = { v: [4,4,2,3,1], sy: { 'Hinchazón':true } }; }
renderVals() {
const L = [['Energía','1 baja · 5 alta'],['Ánimo','1 bajo · 5 alto'],['Estrés','1 bajo · 5 alto'],['Concentración','1 baja · 5 alta'],['Dolor físico','1 nada · 5 mucho']];
const v = this.state.v;
const scales = L.map((l,i)=>({ label:l[0], hint:l[1], opts:[1,2,3,4,5].map(n=>{ const on = v[i]===n; return { v:n, on: on?'true':'false', bg: on?'#F49A9E':'#FFF6CF', fg: '#1B1F5E', border: on?'#E57F86':'#F6E27F', pick:()=>{ const nv=v.slice(); nv[i]=n; this.setState({ v:nv }); } }; }) }));
const names = ['Cólicos','Hinchazón','Dolor de cabeza','Sensibilidad mamaria','Antojos','Acné','Cansancio','Ninguno'];
const sy = this.state.sy;
const symptoms = names.map(n=>({ name:n, on: sy[n]?'true':'false', bg: sy[n]?'#F49A9E':'#FFF6CF', border: sy[n]?'#E57F86':'#F6E27F', pick:()=>this.setState({ sy:{ ...sy, [n]:!sy[n] } }) }));
return { scales, symptoms };
}
}
</script>
</body>
</html>
